# einfold: fast tensor contractions inside SQL engines.
[workspace]
resolver = "3"
members = [
    "crates/einfold-ir",
    "crates/einfold-kernels",
    "crates/einfold-datafusion",
    "crates/einfold-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/xqlsystems/einfold"
homepage = "https://github.com/xqlsystems/einfold"
keywords = ["sql", "datafusion", "tensor", "einsum", "attention"]
categories = ["database", "science", "mathematics"]
authors = ["Alexander Merose <al@merose.com>", "einfold Authors"]
# MSRV, matching ddx. Enforced by the CI `msrv` matrix entry.
rust-version = "1.94"

[workspace.dependencies]
# Any DataFusion 55 from 55.2, as DataFusion's extensions require it: a
# project using einfold can then be on any later 55.x, and Cargo resolves one
# DataFusion for it, einfold and ddx (xqlsystems/ddx) together. einfold's
# public API takes and returns DataFusion's own types, so a new major version
# of DataFusion is a new minor version of einfold. 55.2 is the version einfold's
# tests of DataFusion's behaviors (tests/datafusion_behaviors.rs) ran on; the
# lockfile stays there, and CI also tests the newest 55.x.
datafusion = { version = "55.2" }

# Arrow from the version DataFusion 55.2 requires: einfold-kernels takes and
# returns its arrays, and einfold-datafusion hands it DataFusion's batches.
arrow = { version = "59.2", default-features = false }

einfold-ir = { path = "crates/einfold-ir", version = "0.1.0" }
einfold-kernels = { path = "crates/einfold-kernels", version = "0.1.0" }
einfold-testkit = { path = "crates/einfold-testkit" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
# Google's Rust style guide: mark functions whose result must not be ignored.
must_use_candidate = "warn"
