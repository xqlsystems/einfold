[package]
name = "m2-gate"
version = "0.0.0"
edition = "2021"
publish = false
description = "einfold's M2 gate: demo 1's causal attention in SQL, on DataFusion with einfold on and off, and on DuckDB"

# A standalone crate, like M1's gate, so that a benchmark's dependencies
# stay out of einfold's workspace.
[workspace]

[dependencies]
datafusion = "=55.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
einfold-datafusion = { path = "../../crates/einfold-datafusion" }

[profile.release]
debug = false
