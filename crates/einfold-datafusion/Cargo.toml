[package]
name = "einfold-datafusion"
description = "einfold for Apache DataFusion: finds matrix products, contractions and attention in DataFusion's plans, and runs them with array algorithms"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "README.md"

[dependencies]
async-trait = "0.1"
datafusion = { workspace = true }
einfold-ir = { workspace = true }
einfold-kernels = { workspace = true }
futures = "0.3"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread"] }

[dev-dependencies]
einfold-testkit = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
