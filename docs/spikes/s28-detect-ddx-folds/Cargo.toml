[package]
name = "s28-detect-ddx-folds"
version = "0.0.0"
edition = "2021"
publish = false
description = "Spike S28: how much of ddx's gradient time can einfold find by detection, with no help from ddx?"

# A standalone crate, not a member of einfold's workspace.
[workspace]

[dependencies]
datafusion = "=55.2.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# ddx's public main at the time of the spike.
# `internals` exposes `engine`, which runs and plans single steps, as ddx's own
# benchmark does.
ddx-datafusion = { git = "https://github.com/xqlsystems/ddx", rev = "921aef1a34baa3b58ab32a5a68bd663b35060bfd", features = ["internals"] }

[profile.release]
debug = false
