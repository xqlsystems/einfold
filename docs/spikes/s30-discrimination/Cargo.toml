# Spike S30: folds over joins by discrimination, against einfold's hash path
# and DataFusion.
[package]
name = "einfold-spike-s30"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
datafusion = "=55.2.0"
# einfold's kernels at the top of M1's stack (xqlsystems/einfold#57), which
# isn't on main yet.
einfold-kernels = { git = "https://github.com/xqlsystems/einfold", rev = "cec0fd936dcf3bb418ed0da7f98f85aaa6e5423d" }
einfold-ir = { git = "https://github.com/xqlsystems/einfold", rev = "cec0fd936dcf3bb418ed0da7f98f85aaa6e5423d" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
debug = false
