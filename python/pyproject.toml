[build-system]
requires = ["maturin>=1.6,<2.0"]
build-backend = "maturin"

[project]
name = "einfold"
description = "Array algorithms for tensor computations written in SQL: matrix products, contractions and attention, run fast inside your SQL engine"
requires-python = ">=3.10"
version = "0.1.0"
license = "Apache-2.0"
readme = "README.md"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Source = "https://github.com/xqlsystems/einfold"
Issues = "https://github.com/xqlsystems/einfold/issues"

[project.optional-dependencies]
# The FFI that einfold's DataFusion extension speaks is DataFusion 55's.
datafusion = ["datafusion==55.0.0"]
test = ["datafusion==55.0.0", "pytest", "numpy", "pyarrow"]

[tool.maturin]
module-name = "einfold._native"
features = ["pyo3/extension-module"]
